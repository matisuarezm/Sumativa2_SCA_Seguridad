services:
  mysql-cdy2203:
    image: mysql:8.0
    container_name: mysql-sumativa2
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql

  backend-app:
    build: .
    container_name: backend-app-sumativa2
    ports:
      - "8180:8180"
    depends_on:
      - mysql-cdy2203

volumes:
  mysql_data: