spring.application.name=backend
server.port=8180

# Conexión a la BD (El host coincide con el nombre del servicio en docker-compose)
spring.datasource.url=jdbc:mysql://mysql-cdy2203:3306/mydatabase
#spring.datasource.url=jdbc:mysql://localhost:3307/mydatabase
spring.datasource.username=myuser
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

# Permitir sobrescritura de Beans
spring.main.allow-bean-definition-overriding=true

logging.level.org.springframework.web=trace
logging.level.org.hibernate=trace
logging.level.com=TRACE
logging.file.name=backend.log


